[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leanlocal"
version = "0.1.0"
description = "Lightweight, privacy-conscious Linux capability checks for low-spec hardware."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LeanLocal contributors"}]
dependencies = []

[project.scripts]
leanlocal = "leanlocal.cli:main"
